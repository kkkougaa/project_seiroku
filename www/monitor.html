<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0c0e13">
<title>족자봉 모니터</title>
<style>
@font-face{font-family:"Pretendard Variable";font-weight:45 920;font-style:normal;font-display:swap;src:url("fonts/PretendardVariable.woff2") format("woff2-variations")}
:root{--bg:#0c0e13;--ink:#f4f5f7;--ink2:#a9afba;--tile:#2f7cf6;--tile-ink:#ffffff;--done:#2a2f38;--green:#3fd68f;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:"Pretendard Variable","Apple SD Gothic Neo",-apple-system,system-ui,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
#wrap{height:100%;display:flex;flex-direction:column;padding:max(3vh,env(safe-area-inset-top)) max(4vw,env(safe-area-inset-right)) max(3vh,env(safe-area-inset-bottom)) max(4vw,env(safe-area-inset-left))}
header{display:flex;align-items:baseline;justify-content:space-between;gap:2vw;flex:none}
#name{font-size:6vh;font-weight:800;letter-spacing:-.02em}
#meta{font-size:3.2vh;color:var(--ink2);font-weight:600;font-variant-numeric:tabular-nums}
#stage{flex:1;display:grid;place-content:center;gap:2vh;min-height:0;padding-top:2vh}
.grp{display:flex;flex-direction:column;align-items:center;gap:1.5vh}
.grp h2{font-size:3.4vh;color:var(--ink2);font-weight:700}
.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:var(--gap)}
.t{width:var(--s);height:var(--s);border-radius:calc(var(--s)*.16);background:var(--tile);color:var(--tile-ink);display:grid;place-items:center;position:relative;
  font-size:calc(var(--s)*.62);font-weight:900;line-height:1;letter-spacing:-.02em}
.t small{position:absolute;right:calc(var(--s)*.07);bottom:calc(var(--s)*.05);font-size:calc(var(--s)*.22);font-weight:800}
.t.q{background:#5b2330;color:#ffb3bd;font-size:calc(var(--s)*.2)}
.done .t{background:var(--done);color:#6f7684}
#badge{display:none;font-size:4vh;font-weight:800;color:var(--green)}
.done #badge{display:block}
#idle{font-size:5vh;color:var(--ink2);font-weight:700;text-align:center}
.flash .t{animation:pop .35s cubic-bezier(.2,.9,.3,1.3)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.flash .t{animation:none}}
</style>
</head>
<body>
<div id="wrap"><header><span id="name"></span><span id="meta"></span></header><div id="stage"><p id="idle">대기 중</p></div></div>
<script>
(() => {
  const booth = new URLSearchParams(location.search).get('booth') || (() => { try { return localStorage.getItem('boothpos:device'); } catch { return null; } })() || 'A';
  const KEY = 'boothpos:monitor:' + booth;
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  let lastTs = 0, cur = null;

  function layout(n) {
    const W = $('#stage').clientWidth, H = $('#stage').clientHeight - 60;
    let best = 0;
    for (let cols = 1; cols <= n; cols++) {
      const rows = Math.ceil(n / cols);
      const s = Math.min(W / cols, H / rows) * 0.86;
      if (s > best) best = s;
    }
    document.documentElement.style.setProperty('--s', Math.min(best, H * 0.8) + 'px');
    document.documentElement.style.setProperty('--gap', Math.max(8, best * 0.1) + 'px');
  }

  function show(m, animate) {
    cur = m;
    const wrap = $('#wrap');
    wrap.classList.toggle('done', !!m.done);
    $('#name').textContent = m.name || '';
    const hh = new Date(m.ts).toTimeString().slice(0, 5);
    $('#meta').innerHTML = (m.done ? '<span id="badge" style="display:inline">전달 완료 · </span>' : '') + hh;
    const tiles = [];
    let html = '';
    if (!m.groups || !m.groups.length) {
      html = '<p id="idle">족자봉 없음</p>';
    } else {
      for (const g of m.groups) {
        const isN = x => /^\d+$/.test(x);
        const ent = Object.entries(g.vars).sort(([a], [b]) => (a === '?') - (b === '?') || (isN(a) && isN(b) ? a - b : a.localeCompare(b))); // 숫자 넘버는 1, 2, 10 순서로
        ent.forEach(e => tiles.push(e));
        html += `<div class="grp">${m.groups.length > 1 ? `<h2>${esc(g.name)}</h2>` : ''}<div class="tiles">${ent.map(([L, q]) =>
          L === '?' ? `<div class="t q">종류<br>미정${q > 1 ? ` ×${q}` : ''}</div>` : `<div class="t">${esc(L)}${q > 1 ? `<small>×${q}</small>` : ''}</div>`).join('')}</div></div>`;
      }
    }
    $('#stage').innerHTML = html;
    layout(Math.max(1, tiles.length));
    if (animate) { wrap.classList.remove('flash'); void wrap.offsetWidth; wrap.classList.add('flash'); }
  }

  function readStored() {
    try { const m = JSON.parse(localStorage.getItem(KEY) || 'null'); if (m && m.ts > lastTs) { const fresh = !cur || cur.key !== m.key; lastTs = m.ts; show(m, fresh); } } catch {}
  }
  try { const ch = new BroadcastChannel('boothpos-monitor'); ch.onmessage = e => { const m = e.data; if (m && m.booth === booth && m.ts > lastTs) { const fresh = !cur || cur.key !== m.key; lastTs = m.ts; show(m, fresh); } }; } catch {}
  addEventListener('storage', e => { if (e.key === KEY) readStored(); });
  setInterval(readStored, 1000); // 혹시 신호를 놓쳐도 1초마다 다시 확인해요
  addEventListener('resize', () => cur && show(cur, false));
  readStored();

  async function keepAwake() { try { if ('wakeLock' in navigator && document.visibilityState === 'visible') await navigator.wakeLock.request('screen'); } catch {} }
  document.addEventListener('visibilitychange', keepAwake); keepAwake();
})();
</script>
</body>
</html>

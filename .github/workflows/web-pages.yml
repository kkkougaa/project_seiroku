name: 웹앱 올리기 (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: 관리 사이트 파일 버전 붙이기 (브라우저 캐시 때문에 옛 파일이 안 보이게)
        run: sed -i -E "s/\?v=[0-9A-Za-z]+\"/?v=${GITHUB_SHA::8}\"/g" www/admin/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deployment
        uses: actions/deploy-pages@v4
